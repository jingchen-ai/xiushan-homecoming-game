片留给你决定。`,choices:[{label:`拍下客栈亮灯的窗`,result:`灯影落在梅江河上，照片里终于有了等人回来的地方。`,funds:55,reputation:8,notes:1},{label:`拍下收工吃饭的人`,result:`没有摆拍，只有热饭和笑声；这张照片成了住客最喜欢的一张。`,funds:35,reputation:10,notes:1}]},{chapter:`第三章 · 山野有时`,title:`一篓新茶赶在雨前`,visitor:`兴隆坳茶农田叔`,sprite:2,focus:`meal`,commission:`准备地方餐食，为雨前茶配一份客栈小点`,briefing:`今日至少投入 2 点餐食准备，田叔会带着刚采的新茶下山。`,narrative:`田叔背着竹篓赶在雨前进城。他不想把茶只摆成昂贵礼盒，而想让来秀山的人记住山坡、晨露和采茶人的一天。客栈菜单该怎样写下这杯茶？`,choices:[{label:`做成茶农的一日套餐`,result:`一杯茶配上山路与农事故事，住客开始认真询问兴隆坳。`,funds:70,reputation:7,notes:2},{label:`留一席免费试茶`,result:`街坊和旅人围坐试茶，客栈的院子第一次像个小小赶场。`,funds:30,reputation:12,notes:1}]},{chapter:`第四章 · 万家灯火`,title:`小满想学会第一盏灯`,visitor:`客栈帮手小满`,sprite:3,focus:`culture`,commission:`布置竹灯工位，陪小满完成第一件作品`,briefing:`今日至少投入 2 点非遗展陈，让竹篾、灯纸和工具都能真正动起来。`,narrative:`小满每天都在帮客人提行李，却一直不敢碰那把篾刀。今晚她终于问：花灯是不是只有老师傅才能做？院里的人都停下手，等你的回答。`,choices:[{label:`从最简单的竹圈教起`,result:`第一只竹圈并不圆，但小满把自己的名字写在了灯骨里。`,funds:25,reputation:10,notes:2},{label:`让她先设计灯面故事`,result:`小满画下客栈里来往的人，新的花灯夜有了年轻人的主意。`,funds:40,reputation:8,notes:2}]},{chapter:`边城支线 · 渡口晚风`,title:`罗伯把旧木牌带过了河`,visitor:`洪安渡船人罗伯`,sprite:2,focus:`meal`,commission:`留一桌热饭，听罗伯讲完三省渡口的一天`,briefing:`今日至少投入 2 点餐食准备，收船后的罗伯会沿河赶来。`,narrative:`罗伯带来一块磨得发亮的渡口木牌。它见过赶场、送别和重逢，如今渡船换了新绳，他想把旧牌留在客栈，也担心它离开河边便失去了意义。`,choices:[{label:`做成会讲故事的餐桌号牌`,result:`每位坐下的客人都会问起木牌，渡口的往来进入了客栈日常。`,funds:60,reputation:8,notes:2},{label:`拓下纹理后送回渡口`,result:`客栈留下木纹拓片，旧牌仍守在河风里。`,funds:35,reputation:11,notes:2}]},{chapter:`村落支线 · 一针一线`,title:`阿芷的纹样少了最后一针`,visitor:`苗绣手艺人阿芷`,sprite:3,focus:`culture`,commission:`整理展柜，与阿芷完成一幅只属于客栈的纹样`,briefing:`今日至少投入 2 点非遗展陈，给针线、布片和故事留出位置。`,narrative:`阿芷带来的绣片已经完成大半：山路、河水和花灯彼此相连，中央却空着。她说最后一针不能只为了好看，它应该回答客栈为什么重新开门。`,choices:[{label:`绣一扇亮着灯的窗`,result:`离乡的人看见窗就明白，这里一直留着归家的位置。`,funds:45,reputation:10,notes:2},{label:`绣一条继续向前的河`,result:`老纹样没有封口，新的旅程可以从这里接着绣。`,funds:55,reputation:8,notes:3}]},{chapter:`生态支线 · 清晨有鸟`,title:`湿地来的住客不肯开窗`,visitor:`大溪巡护员林哥`,sprite:0,focus:`room`,commission:`整理安静客房，试做一份不打扰生灵的旅行守则`,briefing:`今日至少投入 2 点客房整理，让早起巡护的住客能真正休息。`,narrative:`林哥天
